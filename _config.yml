title: Lam Nguyen
description: >-
  Lam Nguyen, machine learning researcher. AI for scientific discovery, semantic search, and database internals.
url: https://lamng3.netlify.app
baseurl: ""
lang: en
timezone: America/Los_Angeles

permalink: /blog/:year/:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - package.json
  - package-lock.json
  - README.md
  - CLAUDE.md
  - LICENSE
