title: Lam Nguyen
description: >-
  Lam Nguyen, software engineer at Microsoft. Database internals, agentic
  memory, and memory optimization.
url: https://lamng3.netlify.app
baseurl: ""
lang: en
timezone: America/Los_Angeles

permalink: /blog/:year/:title/
plugins_dir: _disabled

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

include:
  - _pages

exclude:
  - _pages/cv.md
  - _pages/books.md
  - _pages/news.md
  - _pages/projects.md
  - _pages/teaching.md
  - _pages/profiles.md
  - _pages/repositories.md
  - _pages/dropdown.md
  - _pages/about_einstein.md
  - _pages/publications.md
  - _pages/notes.md
  - assets/css/main.scss
  - bin/
  - CLAUDE.md
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - lighthouse_results/
  - node_modules/
  - package.json
  - package-lock.json
  - purgecss.config.js
  - README.md
  - readme_preview/
  - vendor/
  - .npm/
  - .npm-cache/
